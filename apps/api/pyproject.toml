[project]
name = "langchain-api"
version = "0.1.0"
description = "RAG moderne et agent à outils LangChain, streamé au protocole AI SDK"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "langgraph>=1.2.9",
    "langchain-core>=1.5.1",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    # Providers : trois gratuits, un payant. Tous savent appeler des outils.
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    # Serveurs MCP déclarés dans la configuration → outils du graphe.
    "langchain-mcp-adapters>=0.1.9",
    # RBAC natif : hachage de mot de passe et jetons signés. Argon2id est le défaut
    # recommandé par l'OWASP ; PyJWT valide la signature ET les claims (exp, iss).
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.1",
    # RAG : extraction PDF, rendu des pages scannées pour l'OCR, uploads et jeu
    # d'évaluation. Pas de paquet `pgvector` : les
    # vecteurs partent en littéral texte casté (`$n::vector`), donc en paramètre
    # SQL comme les autres — un codec binaire de plus n'apporterait rien ici.
    "pypdf>=5.1.0",
    "pymupdf>=1.26.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `def route(user = Depends(current_user))` est l'idiome FastAPI d'injection : la
# valeur par défaut est un marqueur résolu à chaque requête, pas un objet mutable
# partagé entre appels. B008 vise un vrai piège Python, mais pas celui-là.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
