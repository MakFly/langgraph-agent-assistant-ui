[project]
name = "langgraph-poc-api"
version = "0.1.0"
description = "Agent LangGraph à outils gratuits, streamé au protocole AI SDK"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "langgraph>=1.2.9",
    "langchain-core>=1.5.1",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    # Providers : trois gratuits, un payant. Tous savent appeler des outils.
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    # Serveurs MCP déclarés dans la configuration → outils du graphe.
    "langchain-mcp-adapters>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
